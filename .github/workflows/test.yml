name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Linter self-test
        run: python scripts/ste-lint-he.py --selftest
      - name: Docs follow their own rules
        run: python scripts/ste-lint-he.py --disable synonym-rotation README.md README.he.md SKILL.md CONTRIBUTING.md CHANGELOG.md examples/before-after.md references/writing-rules.md
