name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the zip for (for example v0.2.0)
        required: true

permissions:
  contents: write

jobs:
  skill-zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the skill folder
        run: |
          mkdir -p dist/asd-ste100-hebrew
          cp -R SKILL.md LICENSE references examples scripts dist/asd-ste100-hebrew/
      - name: Validate the skill
        run: |
          pip install "git+https://github.com/agentskills/agentskills#subdirectory=skills-ref"
          skills-ref validate dist/asd-ste100-hebrew
      - name: Zip the skill folder
        working-directory: dist
        run: |
          zip -r -X asd-ste100-hebrew.zip asd-ste100-hebrew
          unzip -l asd-ste100-hebrew.zip
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/asd-ste100-hebrew.zip --clobber
